name: Deploy app

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # refresh community posts every 30 minutes
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs (GitHub's standard Pages setup). With both in one
# job, deploy-pages sometimes looked for the uploaded site before GitHub had registered
# it and failed with "No artifacts named github-pages were found".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The field tools live in this repo. Notes and prototypes below are kept off the live site.
      - name: Build site folder
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude '_site' \
            --exclude '/README.md' --exclude '/CLAUDE.md' --exclude '/home' ./ _site/
          ls _site

      - name: Fetch latest community posts
        env:
          CIRCLE_API_TOKEN: ${{ secrets.CIRCLE_API_TOKEN }}
        run: node scripts/fetch-posts.mjs _site/posts.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
